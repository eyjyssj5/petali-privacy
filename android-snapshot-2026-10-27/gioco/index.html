<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Petali</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="fiore3d.css">
<style id="petali-critical">*{box-sizing:border-box}html{font-family:system-ui,-apple-system,Arial,sans-serif}body{margin:0;color:#473044;background:linear-gradient(160deg,#fff5fa,#f7e9f2);min-height:100vh}header{text-align:center;padding:20px 18px}header h1{font-size:32px;margin:4px 0;color:#883b64}header p{margin:0;color:#92627d}main{max-width:740px;margin:auto;padding:12px 15px}.schermata{display:none}.schermata.attiva{display:block}[hidden]{display:none!important}.griglia{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.carta{background:#fff;border:1px solid #ecd5e2;border-radius:18px;padding:10px;min-width:0}button{cursor:pointer} .petali-modalita{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:17px auto;max-width:740px}.petali-modalita>*{display:flex;flex-direction:column;gap:5px;padding:14px 9px;border-radius:16px;text-align:center;background:white;border:2px solid #e5bcd4;color:#813856;text-decoration:none}.petali-modalita .petali-modalita-3d{background:#a6477e;color:#fff;border-color:#a6477e}.petali-modalita span{font-size:12px}.carta img.fiore-preview{display:block;width:100%;max-width:165px;height:150px;object-fit:contain;margin:auto}.petali-tag{display:block;font-size:12px;font-weight:700;margin:7px 0 3px}.petali-tag.premium{color:#923f6c}.petali-tag.free{color:#26734c}</style>
  <link rel="stylesheet" href="petali-v22-2d.css">
  <link rel="stylesheet" href="ios-safe-area.css">
  <link rel="stylesheet" href="regali.css">
</head>
<body>
  <header>
    <h1 data-i18n="titolo">Petali</h1>
    <p data-i18n="subtitle"></p>
    <details class="menu-lingue">
      <summary data-ui-aria-label="language"><span class="barre"><i></i><i></i><i></i></span></summary>
      <div class="menu-voci">
        <button class="lingua" type="button" data-lingua="it">Italiano</button>
        <button class="lingua" type="button" data-lingua="en">English</button>
        <button class="lingua" type="button" data-lingua="es">Español</button>
        <button class="lingua" type="button" data-lingua="pt">Português</button>
        <button class="lingua" type="button" data-lingua="fr">Français</button>
        <button class="lingua" type="button" data-lingua="de">Deutsch</button>
      </div>
    </details>
  </header>

  <main>
    <section id="benvenuto" class="schermata">
      <h2 data-i18n="benvenuto"></h2>
      <p class="intro" data-i18n="vuoiRegistrarti"></p>
      <button id="btn-registrati" type="button" data-i18n="siRegistrati"></button>
      <button id="btn-salta" type="button" class="secondario" data-i18n="salta"></button>
    </section>

    <section id="registrazione" class="schermata">
      <h2 data-i18n="registrazione"></h2>
      <p class="nota" data-i18n="notaProva"></p>
      <form id="form-registrazione">
        <input id="email" type="email" required data-i18n-placeholder="emailPlaceholder">
        <label class="check">
          <input id="accetto" type="checkbox" required>
          <span data-i18n="accettoTesto"></span>
        </label>
        <div class="legale-link">
          <button type="button" class="link" data-legale="termini" data-i18n="leggiTermini"></button>
          &middot;
          <button type="button" class="link" data-legale="privacy" data-i18n="leggiPrivacy"></button>
        </div>
        <button type="submit" data-i18n="creaAccount"></button>
        <button id="btn-indietro-reg" type="button" class="secondario" data-i18n="indietro"></button>
      </form>
    </section>

    <section id="sesso" class="schermata">
      <h2 data-i18n="sessoDomanda"></h2>
      <div class="coppia-figure">
        <button type="button" class="figura" data-sesso="femmina">
          <img src="img/donna.jpg" alt="">
          <span data-i18n="femmina"></span>
        </button>
        <button type="button" class="figura" data-sesso="maschio">
          <img src="img/uomo.jpg" alt="">
          <span data-i18n="maschio"></span>
        </button>
      </div>
    </section>

    <section id="legale" class="schermata">
      <button id="btn-chiudi-legale" type="button" class="secondario" data-i18n="indietro"></button>
      <iframe id="pagina-legale" title="Documento" data-ui-title="document" src="about:blank"></iframe>
    </section>

    <section id="scelta" class="schermata">
      <p class="intro" data-i18n="intro"></p>
      <h2 data-i18n="sceltaTitolo"></h2>
      <nav class="petali-modalita" aria-label="Scegli versione" data-ui-aria-label="chooseMode">
        <div class="petali-modalita-2d"><strong data-ui="mode2d">🌷 Fiori 2D</strong><span data-ui="freeCount">3 gratis · 12 Premium</span></div>
        <a class="petali-modalita-3d" href="15-fiori-3d/index.html" id="btn-menu-3d"><strong data-ui="mode3d">🌻 Fiori 3D</strong><span id="stato-menu-3d">15 fiori · Premium 3D</span></a>
      </nav>
      <details id="regali-panel" class="petali-regali">
        <summary id="regali-titolo">🎁 Regala un fiore</summary>
        <div class="regali-contenuto">
          <p id="regali-intro">Scegli l'occasione e invia un biglietto digitale.</p>
          <label id="regali-label-occasione" for="regalo-occasione">Per quale occasione?</label>
          <select id="regalo-occasione"></select>
          <label id="regali-label-fiori">Fiori consigliati</label>
          <div id="regalo-fiori" role="group" aria-labelledby="regali-label-fiori"></div>
          <label id="regali-label-a" for="regalo-a">A chi è dedicato?</label>
          <input id="regalo-a" type="text" maxlength="50" autocomplete="off" placeholder="Nome della persona">
          <label id="regali-label-da" for="regalo-da">Da chi?</label>
          <input id="regalo-da" type="text" maxlength="50" autocomplete="off" placeholder="Il tuo nome">
          <label id="regali-label-messaggio" for="regalo-messaggio">La tua dedica</label>
          <textarea id="regalo-messaggio" maxlength="350" rows="3"></textarea>
          <div class="regalo-preview" aria-labelledby="regali-label-preview">
            <strong id="regali-label-preview">Anteprima regalo</strong>
            <div id="regalo-preview-fiore" aria-hidden="true">🌹</div>
            <small id="regalo-preview-occasione"></small>
            <strong id="regalo-preview-nome"></strong>
            <p id="regalo-preview-destinatario"></p>
            <p id="regalo-preview-dedica"></p>
            <p id="regalo-preview-mittente"></p>
          </div>
          <button id="regalo-sblocca" type="button" hidden>Sblocca i fiori Premium 2D</button>
          <div class="regali-azioni">
            <button id="regalo-condividi" type="button">Regala e condividi</button>
            <button id="regalo-copia" type="button" class="secondario">Copia la dedica</button>
          </div>
          <p id="regalo-stato" role="status" aria-live="polite"></p>
        </div>
      </details>
      <button id="btn-suono" class="secondario" type="button"></button>
      <button id="btn-sblocca" type="button" class="secondario" hidden></button>
      <button id="btn-ripristina" class="secondario" type="button">Ripristina acquisti</button>
      <div id="griglia-fiori" class="griglia"></div>
      <div class="piepagina">
        <div class="legale-link">
          <button type="button" class="link" data-legale="termini" data-i18n="termini"></button> ·
          <button type="button" class="link" data-legale="privacy" data-i18n="privacy"></button> ·
          <button type="button" class="link" data-legale="cancellazione" data-i18n="cancellazione"></button>
        </div>
        <button id="btn-cancella" type="button" class="pericolo" data-i18n="cancellaAccount"></button>
      </div>
    </section>

    <section id="gioco" class="schermata">
      <button id="btn-indietro" class="secondario" type="button" data-i18n="indietro"></button>
      <h2 id="nome-fiore"></h2>
      <a id="btn-apri-3d" class="collegamento-3d" href="15-fiori-3d/index.html">🔒 Versione 3D Premium</a>
      <p id="significato-fiore" class="significato"></p>
      <div id="descrizione-fiore" class="descrizione">
        <p><strong data-i18n="aspetto"></strong> <span id="desc-testo"></span></p>
        <p><strong data-i18n="storia"></strong> <span id="storia-testo"></span></p>
      </div>
      <div id="immagine-fiore"></div>

      <div id="scelta-inizio" class="scelta-inizio" hidden>
        <p data-i18n="inizioDomanda"></p>
        <div class="coppia">
          <button id="btn-inizia-non-mama" type="button" class="secondario scelta">💔 <span data-i18n="nonMama"></span></button>
          <button id="btn-inizia-mama" type="button" class="scelta"><span data-i18n="mama"></span> ❤</button>
        </div>
      </div>

      <button id="btn-petalo" type="button" data-i18n="togli" hidden></button>

      <div id="esito" class="esito" hidden>
        <p id="esito-testo"></p>
        <p id="esito-messaggio"></p>
        <button id="btn-ricomincia" type="button" data-i18n="ricomincia"></button>
      </div>

      <div id="simboli" class="simboli">
        <span id="simbolo-nonmama" class="simbolo">💔 <span data-i18n="nonMama"></span></span>
        <span id="simbolo-mama" class="simbolo"><span data-i18n="mama"></span> ❤</span>
      </div>
    </section>
  </main>

  <script src="fiori.js"></script>
  <script src="lingue-extra.js"></script>
  <script src="fiori-pt.js"></script>
  <script src="fiori-fr.js"></script>
  <script src="fiori-de.js"></script>
  <script src="pagamenti-config.js"></script>
  <script src="native-bridge.js"></script>
  <script src="paywall.js"></script>
  <script src="ui-i18n.js"></script>
  <script src="app.js"></script>
  <script src="regali-catalogo.js"></script>
  <script src="regali.js"></script>
<noscript>Per utilizzare Petali occorre JavaScript attivo.</noscript>
</body>
</html>
