name: PETALI Google Play Billing - build verification

on:
  push:
    branches:
      - feature/petali-regali-occasioni-2026-11-22
      - feature/petali-regali-gif-fedelta-20261128
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify PETALI and test payment paths
        working-directory: android-snapshot-2026-10-27
        shell: bash
        run: |
          set -euo pipefail
          python3 verifica_petali.py
          npm ci --no-audit --no-fund
          npm install --save-exact @capacitor-community/admob@8.4.2 --no-audit --no-fund
          npm test
          PETALI_ADS_PLATFORM=android PETALI_ADS_MODE=test node native/configure-ads.mjs web
          npm run build:bridge
          npx cap sync android
          PETALI_ADS_PLATFORM=android PETALI_ADS_MODE=test node native/configure-ads.mjs native
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> android/gradle.properties
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Save verification AAB (not for Play publication)
        uses: actions/upload-artifact@v4
        with:
          name: Petali-Android-verification
          path: android-snapshot-2026-10-27/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
