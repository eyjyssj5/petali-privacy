name: Petali girasole 3D variabile
on:
  push:
    paths:
      - 'gioco/girasole-variabile/**'
      - '.github/workflows/petali-girasole-variabile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check gioco/girasole-variabile/app.js
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/petali-sunflower.log 2>&1 &
          sleep 2
      - name: Browser WebGL test variable petal count
        run: node gioco/girasole-variabile/browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: girasole-3d-variabile-browser
          path: |
            girasole-variabile-3d.png
            girasole-centro-intatto.png
            girasole-second-round.png
          if-no-files-found: ignore
