name: Petali Android Debug
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [feature/petali-3d-mobile-20261016]
    paths:
      - "gioco/**"
      - "native/**"
      - "package.json"
      - "capacitor.config.json"
      - "tests/**"
      - ".github/workflows/petali-android-debug.yml"
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Dipendenze e test
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Prepara Capacitor Android
        run: |
          npm run build:bridge
          npx cap add android
          npx cap sync android
      - name: Compila APK di debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: petali-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
