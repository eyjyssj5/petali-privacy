name: Petali - Importazione modelli botanici reali
on:
  push:
    paths:
      - 'scripts/petali_scan_botanici.py'
      - '.github/workflows/petali-botanical-models.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GLB validator
        run: python -m pip install --quiet trimesh numpy pillow pygltflib
      - name: Download and inspect separate licensed species
        run: python scripts/petali_scan_botanici.py
      - name: Keep real models in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gioco/modelli-botanici/
          if ! git diff --staged --quiet; then
            git commit -m "Import CC0 3D candidates for six Petali flower species"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: petali-botanical-real-glb-audit
          path: gioco/modelli-botanici/AUDIT_MODELLI.json
          if-no-files-found: ignore
