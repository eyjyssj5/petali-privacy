name: Petali iOS Simulator (unsigned)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'gioco/**'
      - 'native/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'tests/**'
      - '.github/workflows/ios-simulator.yml'
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and test
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Prepare iOS project
        run: npm run ios:init
      - name: Check simulator build
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
