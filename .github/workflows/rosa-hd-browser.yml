name: Rosa HD Sketchfab browser test
on:
  push:
    paths:
      - 'gioco/rosa-hd/**'
      - '.github/workflows/rosa-hd-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          sleep 2
      - run: node gioco/rosa-hd/browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rosa-hd-browser
          path: rosa-hd-browser.png
          if-no-files-found: ignore
