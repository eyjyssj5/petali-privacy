name: PETALI REGALI V2 - AAB da firmare

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/petali-regali-v2-aab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sorgenti della versione provata su Android
        uses: actions/checkout@v4
        with:
          ref: feature/petali-regali-occasioni-2026-11-22
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test e genera Android App Bundle
        working-directory: android-snapshot-2026-10-27
        shell: bash
        run: |
          set -euo pipefail
          python3 verifica_petali.py
          npm ci --no-audit --no-fund
          npm test
          npm run build:bridge
          npx cap sync android
          cd android
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -tq app/build/outputs/bundle/release/app-release.aab >/dev/null
      - name: Prepara AAB NON firmato
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-snapshot-2026-10-27/android/app/build/outputs/bundle/release/app-release.aab dist/Petali-Regali-V2-Play-DA-FIRMARE.aab
          test -s dist/Petali-Regali-V2-Play-DA-FIRMARE.aab
          sha256sum dist/Petali-Regali-V2-Play-DA-FIRMARE.aab
      - name: Pubblica artefatto per firma locale
        uses: actions/upload-artifact@v4
        with:
          name: PETALI-V2-AAB-DA-FIRMARE
          path: dist/Petali-Regali-V2-Play-DA-FIRMARE.aab
          if-no-files-found: error
          retention-days: 30
