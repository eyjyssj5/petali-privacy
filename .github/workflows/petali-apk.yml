name: Petali Android APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/petali-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REVENUECAT_ANDROID_PUBLIC_KEY: ${{ vars.REVENUECAT_ANDROID_PUBLIC_KEY }}
      REVENUECAT_IOS_PUBLIC_KEY: ${{ vars.REVENUECAT_IOS_PUBLIC_KEY }}
    steps:
      - name: Carica sorgenti Petali
        uses: actions/checkout@v4
        with:
          ref: release/petali-pagamenti-verifica-2026-10-28
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK preinstallato
        run: |
          test -d "$ANDROID_HOME/platforms"
          echo "Android SDK: $ANDROID_HOME"
      - name: Verifica e compila APK
        working-directory: android-snapshot-2026-10-27
        shell: bash
        run: |
          set -euo pipefail
          python3 verifica_petali.py
          npm ci --no-audit --no-fund
          npm test
          npm run build:bridge
          npx cap sync android
          cd android
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Prepara file APK da distribuire
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-snapshot-2026-10-27/android/app/build/outputs/apk/debug/app-debug.apk dist/Petali-Android-Prova.apk
          unzip -tq dist/Petali-Android-Prova.apk > /dev/null
          test -s dist/Petali-Android-Prova.apk
      - name: Pubblica APK scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: Petali-Android-APK
          path: dist/Petali-Android-Prova.apk
          if-no-files-found: error
          retention-days: 30

      - name: Pubblica link diretto GitHub (release di prova)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="petali-android-prova-2026-11-08"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Petali-Android-Prova.apk --clobber
          else
            gh release create "$TAG" dist/Petali-Android-Prova.apk \
              --title "Petali Android - versione di prova" \
              --notes "APK debug di prova. I pagamenti Premium sono disabilitati finche RevenueCat e Google Play non risultano configurati e verificati. Non e una release pronta per Play Store." \
              --prerelease --target "$GITHUB_SHA"
          fi
